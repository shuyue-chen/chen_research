<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if page.title %}
            {{ page.title }} — {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta
        name="description"
        content="{{ site.description }}"
    >

    <link
        rel="stylesheet"
        href="{{ '/css/style.css' | relative_url }}"
    >

</head>


<body>

<header class="site-header">

    <div class="site-container header-inner">

        <a
            href="{{ '/' | relative_url }}"
            class="site-name"
        >
            {{ site.title }}
        </a>


        <nav
            class="site-nav"
            aria-label="Main navigation"
        >

            <a href="{{ '/' | relative_url }}">
                Home
            </a>

            <a href="{{ '/research/' | relative_url }}">
                Research
            </a>

            <a href="{{ '/projects/' | relative_url }}">
                Projects
            </a>

            <a href="{{ '/notes/' | relative_url }}">
                Notes
            </a>

        </nav>

    </div>

</header>


<main>

    {{ content }}

</main>


<footer class="site-footer">

    <div class="site-container">

        <p>
            © {{ site.time | date: "%Y" }} {{ site.title }}
        </p>

    </div>

</footer>

</body>

</html>
