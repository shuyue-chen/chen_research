---
layout: default
---

<section class="intro">

    <div class="site-container narrow">

        {% if page.eyebrow %}
            <p class="eyebrow">
                {{ page.eyebrow }}
            </p>
        {% endif %}

        <h1>
            {{ page.title }}
        </h1>

        {% if page.description %}
            <p class="intro-text">
                {{ page.description }}
            </p>
        {% endif %}

    </div>

</section>


<section class="section">

    <div class="site-container narrow">

        {{ content }}

    </div>

</section>
