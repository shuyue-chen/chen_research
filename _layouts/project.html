---
layout: default
---

<section class="intro">

    <div class="site-container narrow">

        <p class="eyebrow">

            {% if page.date %}
                {{ page.date | date: "%Y" }}
            {% endif %}

            {% if page.type %}
                · {{ page.type }}
            {% endif %}

        </p>

        <h1>
            {{ page.title }}
        </h1>

        {% if page.description %}
            <p class="intro-text">
                {{ page.description }}
            </p>
        {% endif %}

    </div>

</section>


<section class="section">

    <div class="site-container narrow">

        {{ content }}

    </div>

</section>


<section class="section">

    <div class="site-container narrow">

        <p>
            <a href="{{ '/projects/' | relative_url }}">
                ← Back to Projects
            </a>
        </p>

    </div>

</section>
