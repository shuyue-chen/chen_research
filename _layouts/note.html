---
layout: default
---

<section class="intro">

    <div class="site-container narrow">

        <p class="eyebrow">

            {{ page.date | date: "%B %-d, %Y" }}

            {% if page.type %}
                · {{ page.type }}
            {% endif %}

        </p>

        <h1>
            {{ page.title }}
        </h1>

    </div>

</section>


<section class="section">

    <div class="site-container narrow">

        <article class="note-content">

            {{ content }}

        </article>

    </div>

</section>


<section class="section">

    <div class="site-container narrow">

        <p>
            <a href="{{ '/notes/' | relative_url }}">
                ← Back to Notes
            </a>
        </p>

    </div>

</section>
